<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Model select</title>
<style>
  :root {
    --page: #f4f4f3;
    --surface: #ffffff;
    --menu: #ffffff;
    --hover: #ececea;
    --selected: #f4f4f3;
    --border: #e2e1df;
    --border-strong: #cfcecc;
    --text: #1b1a19;
    --muted: #63605c;
    --faint: #8b8885;
    --accent: #7c3aed;
    --accent-soft: rgba(124, 58, 237, 0.09);
    --ring: rgba(0, 0, 0, 0.07);
    --shadow: 0 20px 50px rgba(0, 0, 0, 0.16), 0 2px 6px rgba(0, 0, 0, 0.08);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --menu-in: 150ms;
    --menu-out: 70ms;
    --radius-trigger: 8px;
    --radius-menu: 12px;
    --radius-item: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #100f0e;
      --surface: #1a1918;
      --menu: #1e1d1b;
      --hover: #262422;
      --selected: #2a2825;
      --border: #2c2a28;
      --border-strong: #3d3a36;
      --text: #ece8e2;
      --muted: #aaa49d;
      --faint: #76716b;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.12);
      --ring: rgba(0, 0, 0, 0.6);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--page);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .demo { width: 100%; max-width: 380px; }
  .label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin: 0 0 6px 2px;
  }
  .field { position: relative; }
  .trigger {
    width: 100%;
    min-height: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-trigger);
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: default;
  }
  @media (hover: hover) and (pointer: fine) {
    .trigger:hover { background: var(--hover); }
  }
  .trigger:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .trigger[aria-expanded="true"] { border-color: var(--border-strong); }
  .trigger-text { flex: 1; min-width: 0; }
  .trigger-name {
    display: block;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .trigger-id {
    display: block;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chev {
    flex: none;
    width: 16px;
    height: 16px;
    color: var(--muted);
    transition: transform 180ms var(--ease-out);
  }
  .trigger[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .menu {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 6px);
    z-index: 20;
    margin: 0;
    padding: 4px;
    list-style: none;
    background: var(--menu);
    border: 1px solid var(--border);
    border-radius: var(--radius-menu);
    box-shadow: 0 0 0 1px var(--ring), var(--shadow);
    overflow-y: auto;
    opacity: 0;
    transform: translateY(-3px) scale(0.97);
    transform-origin: top center;
    transition:
      opacity var(--menu-out) ease-in,
      transform var(--menu-out) ease-in,
      visibility 0s linear var(--menu-out);
    pointer-events: none;
    visibility: hidden;
  }
  .menu[data-dir="up"] {
    top: auto;
    bottom: calc(100% + 6px);
    transform: translateY(3px) scale(0.97);
    transform-origin: bottom center;
  }
  .menu[data-state="open"] {
    opacity: 1;
    transform: none;
    transition:
      opacity var(--menu-in) var(--ease-out),
      transform var(--menu-in) var(--ease-out),
      visibility 0s;
    pointer-events: auto;
    visibility: visible;
  }
  .opt {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 7px 10px 7px 6px;
    border-radius: var(--radius-item);
    cursor: default;
  }
  @media (hover: hover) and (pointer: fine) {
    .opt:not([aria-disabled="true"]):hover { background: var(--hover); }
  }
  .opt[data-active="true"]:not([aria-disabled="true"]) { background: var(--hover); }
  .opt[aria-selected="true"] { background: var(--selected); }
  .opt[aria-disabled="true"] { color: var(--faint); }
  .opt[aria-disabled="true"] .opt-name,
  .opt[aria-disabled="true"] .opt-desc { color: var(--faint); }
  .check {
    width: 16px;
    height: 16px;
    justify-self: center;
    color: var(--accent);
    opacity: 0;
  }
  .opt[aria-selected="true"] .check { opacity: 1; }
  .opt-main { min-width: 0; }
  .opt-name {
    display: block;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .opt-name .id {
    margin-left: 6px;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
  }
  .opt-desc {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .opt-note {
    font-size: 12px;
    color: var(--faint);
    white-space: nowrap;
  }
  .menu-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    padding: 8px 10px 6px;
    margin-top: 4px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--faint);
  }
  kbd {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    padding: 0 4px;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    background: var(--surface);
    color: var(--muted);
  }
  .hint {
    margin: 8px 2px 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  .status {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 10px 2px 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  .status strong { color: var(--text); font-weight: 500; }
  .nomatch {
    padding: 10px 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .vh {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  @media (pointer: coarse) {
    .trigger { min-height: 44px; }
    .opt { min-height: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --menu-in: 80ms; --menu-out: 1ms; }
    .menu, .menu[data-dir="up"] { transform: none; }
    .chev { transition: none; }
  }
</style>
<style>/* component only: no labels or helper text */.label,.field-label,.hint,.status{display:none!important}</style>
</head>
<body>
  <div class="demo">
    <span class="label" id="model-label">Model</span>
    <div class="field">
      <button
        type="button"
        class="trigger"
        id="trigger"
        aria-haspopup="listbox"
        aria-expanded="false"
        aria-labelledby="model-label trigger-name"
      >
        <span class="trigger-text">
          <span class="trigger-name" id="trigger-name"></span>
          <span class="trigger-id" id="trigger-id"></span>
        </span>
        <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
      </button>
      <ul class="menu" role="listbox" id="menu" aria-labelledby="model-label" data-state="closed" tabindex="-1" hidden></ul>
    </div>
    <p class="hint">Applies to new generations in this workspace.</p>
    <p class="status" id="status"></p>
    <p class="vh" role="status" id="live"></p>
  </div>

<script>
(function () {
  "use strict";
  var MODELS = [
    { id: "glm-5.3", name: "GLM 5.3", desc: "Most capable, best for hard reasoning", fact: "Strongest reasoning" },
    { id: "glm-5.3-flash", name: "GLM 5.3 Flash", desc: "Fast drafts and routine edits", fact: "Fastest" },
    { id: "muse-spark-1.3", name: "Muse Spark 1.3", desc: "Balanced quality and speed", fact: "Balanced", selected: true },
    { id: "gpt-6.1-sol", name: "GPT 6.1 Sol", desc: "Strong generalist", fact: "Generalist" },
    { id: "deepseek-v4.1-flash", name: "DeepSeek V4.1 Flash", desc: "Low cost at scale", fact: "Low cost" },
    { id: "qwen-3.8-max", name: "Qwen 3.8 Max", desc: "Long context specialist", fact: "Long context" },
    { id: "mimo-v2.6-flash", name: "Mimo V2.6 Flash", desc: "Not available in this workspace", fact: "", disabled: true }
  ];

  var trigger = document.getElementById("trigger");
  var menu = document.getElementById("menu");
  var triggerName = document.getElementById("trigger-name");
  var triggerId = document.getElementById("trigger-id");
  var status = document.getElementById("status");
  var live = document.getElementById("live");

  var selected = MODELS.find(function (m) { return m.selected; }) || MODELS[0];
  var activeId = selected.id;
  var open = false;
  var typeBuf = "";
  var typeTimer = null;
  var closeTimer = null;
  var noMatchEl = null;

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function render() {
    var html = "";
    MODELS.forEach(function (m) {
      html += '<li class="opt" role="option" id="opt-' + m.id + '"' +
        ' aria-selected="' + (m.id === selected.id) + '"' +
        (m.disabled ? ' aria-disabled="true"' : "") +
        ' data-active="' + (!m.disabled && m.id === activeId) + '"' +
        ' title="' + esc(m.name + " · " + m.id) + '"' +
        ' data-id="' + m.id + '">' +
        '<svg class="check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"/></svg>' +
        '<span class="opt-main"><span class="opt-name">' + esc(m.name) +
        '<span class="id">' + esc(m.id) + "</span></span>" +
        '<span class="opt-desc">' + esc(m.desc) + "</span></span>" +
        (m.disabled ? '<span class="opt-note">Unavailable</span>' : "<span></span>") +
        "</li>";
    });
    html += '<li class="nomatch" id="nomatch" hidden>No matching model. Keep typing or press Esc.</li>';
    html += '<li class="menu-foot" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> select</span><span><kbd>esc</kbd> close</span><span>type to jump</span></li>';
    menu.innerHTML = html;
    noMatchEl = document.getElementById("nomatch");
    menu.querySelectorAll(".opt").forEach(function (el) {
      el.addEventListener("click", function () {
        choose(el.getAttribute("data-id"));
      });
      el.addEventListener("mousemove", function () {
        var id = el.getAttribute("data-id");
        if (id !== activeId && !isDisabled(id)) setActive(id);
      });
    });
  }

  function isDisabled(id) {
    var m = MODELS.find(function (x) { return x.id === id; });
    return !!(m && m.disabled);
  }

  function enabled() {
    return MODELS.filter(function (m) { return !m.disabled; });
  }

  function syncTrigger() {
    triggerName.textContent = selected.name;
    triggerId.textContent = selected.id;
    trigger.title = selected.name + " · " + selected.id;
    status.innerHTML = "<strong>" + esc(selected.fact || selected.name) + "</strong><span>" + esc(selected.desc) + "</span>";
  }

  function setActive(id) {
    activeId = id;
    menu.querySelectorAll(".opt").forEach(function (el) {
      el.setAttribute("data-active", el.getAttribute("data-id") === id ? "true" : "false");
    });
    trigger.setAttribute("aria-activedescendant", "opt-" + id);
    var el = document.getElementById("opt-" + id);
    if (el) el.scrollIntoView({ block: "nearest" });
  }

  function place() {
    var r = trigger.getBoundingClientRect();
    var below = window.innerHeight - r.bottom;
    var above = r.top;
    var dir = below >= 220 || below >= above ? "down" : "up";
    menu.setAttribute("data-dir", dir);
    var room = (dir === "down" ? below : above) - 12;
    menu.style.maxHeight = Math.max(140, Math.min(336, room)) + "px";
  }

  function hideMenu(instant) {
    menu.setAttribute("data-state", "closed");
    trigger.removeAttribute("aria-activedescendant");
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var wait = instant || reduced ? 0 : 80;
    window.clearTimeout(closeTimer);
    closeTimer = window.setTimeout(function () {
      menu.hidden = true;
    }, wait);
  }

  function openMenu() {
    if (open) return;
    open = true;
    trigger.setAttribute("aria-expanded", "true");
    render();
    menu.hidden = false;
    if (isDisabled(activeId)) activeId = selected.id;
    setActive(isDisabled(activeId) ? enabled()[0].id : activeId);
    place();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        if (open) menu.setAttribute("data-state", "open");
      });
    });
  }

  function closeMenu(refocus) {
    if (!open) return;
    open = false;
    trigger.setAttribute("aria-expanded", "false");
    hideMenu(false);
    typeBuf = "";
    if (noMatchEl) noMatchEl.hidden = true;
    if (refocus) trigger.focus();
  }

  function choose(id) {
    if (isDisabled(id)) return;
    selected = MODELS.find(function (m) { return m.id === id; });
    syncTrigger();
    live.textContent = "Selected " + selected.name;
    closeMenu(true);
    render();
  }

  function move(dir) {
    var list = enabled().map(function (m) { return m.id; });
    var i = list.indexOf(activeId);
    if (i === -1) i = list.indexOf(selected.id);
    i = (i + dir + list.length) % list.length;
    setActive(list[i]);
  }

  trigger.addEventListener("click", function () {
    if (open) closeMenu(false);
    else openMenu();
  });

  trigger.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!open) {
        openMenu();
        if (e.key === "ArrowUp") {
          var list = enabled().map(function (m) { return m.id; });
          setActive(list[list.length - 1]);
        }
      } else {
        move(e.key === "ArrowDown" ? 1 : -1);
      }
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (open) choose(activeId);
      else openMenu();
    } else if (e.key === "Escape") {
      if (open) { e.preventDefault(); closeMenu(true); }
    } else if (e.key === "Home") {
      if (open) { e.preventDefault(); setActive(enabled()[0].id); }
    } else if (e.key === "End") {
      if (open) { e.preventDefault(); var l = enabled(); setActive(l[l.length - 1].id); }
    } else if (e.key === "Tab") {
      if (open) closeMenu(false);
    } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (!open) openMenu();
      typeBuf += e.key.toLowerCase();
      window.clearTimeout(typeTimer);
      typeTimer = window.setTimeout(function () { typeBuf = ""; if (noMatchEl) noMatchEl.hidden = true; }, 600);
      var hit = enabled().find(function (m) {
        return m.name.toLowerCase().startsWith(typeBuf) || m.id.toLowerCase().startsWith(typeBuf);
      });
      if (hit) {
        if (noMatchEl) noMatchEl.hidden = true;
        setActive(hit.id);
      } else if (noMatchEl) {
        noMatchEl.hidden = false;
      }
    }
  });

  document.addEventListener("pointerdown", function (e) {
    if (open && !e.target.closest(".field")) closeMenu(false);
  });

  window.addEventListener("resize", function () {
    if (open) place();
  });

  render();
  syncTrigger();
})();
</script>
</body>
</html>

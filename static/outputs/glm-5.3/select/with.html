<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  /* Tokens: no system exists in this file, so a minimal one lives here. */
  :root {
    color-scheme: light;
    /* surfaces */
    --bg: #f6f5f1;
    --surface: #ffffff;
    --hover: #f0efe9;
    /* lines */
    --line: #e6e4de;
    --line-strong: #c9c5ba;
    --line-strong-hover: #a8a396;
    /* text */
    --fg: #23211d;
    --muted: #6b665c;
    --faint: #999388;
    /* one accent, for selection and focus only */
    --accent: #3057d5;
    /* geometry */
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    /* type */
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    /* motion */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in: cubic-bezier(0.55, 0, 1, 0.45);
    --dur-hover: 110ms;
    --dur-menu-in: 130ms;
    --dur-menu-out: 70ms;
    --dur-toggle: 180ms;
    /* elevation: 1px ring plus one soft large shadow, menus only */
    --shadow-menu: 0 0 0 1px var(--line), 0 4px 12px rgba(35, 33, 29, 0.08), 0 16px 40px rgba(35, 33, 29, 0.14);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #131211;
      --surface: #1c1b19;
      --hover: #262522;
      --line: #2b2926;
      --line-strong: #403c37;
      --line-strong-hover: #57524b;
      --fg: #ece8e0;
      --muted: #a49d91;
      --faint: #7a746a;
      --accent: #8fb2ff;
      --shadow-menu: 0 0 0 1px #322f2a, 0 6px 16px rgba(0, 0, 0, 0.35), 0 20px 48px rgba(0, 0, 0, 0.5);
    }
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .select {
    position: relative;
    width: min(360px, 100%);
  }

  /* Trigger */
  .trigger {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 40px;
    padding: 0 12px;
    font: inherit;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-md);
    cursor: default;
    touch-action: manipulation;
    transition:
      border-color var(--dur-hover) var(--ease-out),
      background-color var(--dur-hover) var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .trigger:hover {
      border-color: var(--line-strong-hover);
    }
  }

  .trigger:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .trigger-name {
    flex: 1;
    min-width: 0;
    text-align: left;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chev {
    display: grid;
    place-items: center;
    width: 16px;
    height: 16px;
    color: var(--muted);
    transition:
      transform var(--dur-toggle) var(--ease-out),
      color var(--dur-hover) var(--ease-out);
  }

  .select[data-state="open"] .chev {
    transform: rotate(180deg);
    color: var(--fg);
  }

  /* Popup. Exit timing on the closed rule, entrance on the open rule. */
  .listbox {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 6px);
    margin: 0;
    padding: 6px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-menu);
    overflow-y: auto;
    overscroll-behavior: contain;
    max-height: min(340px, calc(100dvh - 32px));
    z-index: 1;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-2px) scale(0.97);
    transform-origin: top center;
    transition:
      opacity var(--dur-menu-out) var(--ease-in),
      transform var(--dur-menu-out) var(--ease-in),
      visibility 0s linear var(--dur-menu-out);
  }

  .select[data-placement="top"] > .listbox {
    top: auto;
    bottom: calc(100% + 6px);
    transform-origin: bottom center;
    transform: translateY(2px) scale(0.97);
  }

  .select[data-state="open"] > .listbox {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition:
      opacity var(--dur-menu-in) var(--ease-out),
      transform var(--dur-menu-in) var(--ease-out);
  }

  /* Options */
  .group-label {
    padding: 10px 8px 4px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }

  .group:first-child .group-label {
    padding-top: 2px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    padding: 0 8px;
    border-radius: var(--radius-sm);
    color: var(--fg);
    cursor: default;
    touch-action: manipulation;
  }

  .opt-check {
    display: grid;
    place-items: center;
    width: 16px;
    height: 16px;
    color: var(--accent);
  }

  .opt-check svg {
    opacity: 0;
    transition: opacity 120ms var(--ease-out);
  }

  .option[data-selected="true"] .opt-check svg {
    opacity: 1;
  }

  .opt-name {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .opt-meta {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .option[data-highlighted="true"] {
    background: var(--hover);
  }

  @media (hover: hover) and (pointer: fine) {
    .option:not([aria-disabled="true"]):hover {
      background: var(--hover);
    }
  }

  .option[aria-disabled="true"] {
    color: var(--faint);
  }

  .option[aria-disabled="true"] .opt-name {
    font-weight: 400;
  }

  .option[aria-disabled="true"] .opt-meta {
    color: var(--faint);
  }

  /* Screen-reader-only live region: selection changes are announced, not shown. */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* Touch targets */
  @media (pointer: coarse) {
    .trigger {
      min-height: 44px;
    }

    .option {
      min-height: 44px;
    }
  }

  /* Reduced motion: drop movement, keep a short fade */
  @media (prefers-reduced-motion: reduce) {
    .listbox {
      transform: none;
      transition:
        opacity 80ms linear,
        visibility 0s linear 80ms;
    }

    .select[data-state="open"] > .listbox {
      transition: opacity 80ms linear;
    }

    .chev {
      transition: none;
    }

    .select[data-state="open"] .chev {
      transform: none;
    }

    .opt-check svg {
      transition: none;
    }

    .trigger {
      transition: none;
    }
  }
</style>
<style>/* component only: no labels or helper text */.label,.field-label,.hint,.status{display:none!important}</style>
</head>
<body>
<main>
  <div class="select" id="select" data-state="closed">
    <button
      type="button"
      class="trigger"
      id="trigger"
      role="combobox"
      aria-haspopup="listbox"
      aria-expanded="false"
      aria-controls="model-options"
    >
      <span class="trigger-name" id="trigger-name">Claude Sonnet 4.5</span>
      <span class="chev" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.25 8 10l4-3.75" /></svg>
      </span>
    </button>
    <div class="listbox" role="listbox" id="model-options" aria-label="Models"></div>
  </div>
  <p class="sr-only" aria-live="polite" id="model-announce"></p>
</main>

<script>
(function () {
  'use strict';

  var MODELS = [
    { id: 'claude-sonnet-4-5', name: 'Claude Sonnet 4.5', group: 'Anthropic', context: '200K', desc: 'Balanced pick for everyday coding and review.' },
    { id: 'claude-opus-4-1', name: 'Claude Opus 4.1', group: 'Anthropic', context: '200K', desc: 'Deepest reasoning for planning and long migrations.' },
    { id: 'gpt-5-2', name: 'GPT-5.2', group: 'OpenAI', context: '400K', desc: 'Strong general-purpose default with fast tool use.' },
    { id: 'gpt-5-2-mini', name: 'GPT-5.2 mini', group: 'OpenAI', context: '400K', desc: 'Cheaper runs for bulk edits and labeling.' },
    { id: 'o4-mini', name: 'o4-mini', group: 'OpenAI', context: '200K', desc: 'Compact reasoning model.', note: 'Access requested' },
    { id: 'gemini-2-5-pro', name: 'Gemini 2.5 Pro', group: 'Google', context: '1M', desc: 'Long context for whole-repository questions.' },
    { id: 'gemini-2-5-flash', name: 'Gemini 2.5 Flash', group: 'Google', context: '1M', desc: 'Fastest replies for short tasks.' },
    { id: 'deepseek-v4', name: 'DeepSeek V4', group: 'DeepSeek', context: '128K', desc: 'Open weights, strong in refactor loops.' },
    { id: 'llama-4-maverick', name: 'Llama 4 Maverick', group: 'Meta', context: '256K', desc: 'Self-hostable for private data.' }
  ];

  var CHECK_SVG =
    '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 8.5l2.75 2.75 5.75-6.5" /></svg>';

  var root = document.getElementById('select');
  var trigger = document.getElementById('trigger');
  var listbox = document.getElementById('model-options');
  var nameEl = document.getElementById('trigger-name');
  var announce = document.getElementById('model-announce');

  /* Build the listbox: options grouped by provider. */
  var html = '';
  var lastGroup = null;
  MODELS.forEach(function (m) {
    if (m.group !== lastGroup) {
      if (lastGroup !== null) html += '</div>';
      var gid = 'grp-' + m.group.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      html += '<div class="group" role="group" aria-labelledby="' + gid + '">';
      html += '<div class="group-label" id="' + gid + '">' + m.group + '</div>';
      lastGroup = m.group;
    }
    html +=
      '<div class="option" role="option" id="opt-' + m.id + '" data-id="' + m.id + '" aria-selected="false"' +
      (m.note ? ' aria-disabled="true"' : '') +
      '><span class="opt-check">' + CHECK_SVG + '</span>' +
      '<span class="opt-name">' + m.name + '</span>' +
      '<span class="opt-meta">' + (m.note || m.context) + '</span></div>';
  });
  html += '</div>';
  listbox.innerHTML = html;

  var isOpen = false;
  var selected = null;
  var highlighted = null;
  var buffer = '';
  var bufferTimer = null;

  function byId(id) {
    for (var i = 0; i < MODELS.length; i++) {
      if (MODELS[i].id === id) return MODELS[i];
    }
    return null;
  }

  function enabled() {
    return MODELS.filter(function (m) {
      return !m.note;
    });
  }

  function optionEl(m) {
    return m ? listbox.querySelector('[data-id="' + m.id + '"]') : null;
  }

  selected = byId('claude-sonnet-4-5');

  function renderSelection() {
    nameEl.textContent = selected.name;
    MODELS.forEach(function (m) {
      var el = optionEl(m);
      var isSel = m.id === selected.id;
      el.setAttribute('aria-selected', isSel ? 'true' : 'false');
      el.setAttribute('data-selected', isSel ? 'true' : 'false');
    });
    announce.textContent = selected.name;
  }

  function clearHighlight() {
    var prev = listbox.querySelector('[data-highlighted="true"]');
    if (prev) prev.removeAttribute('data-highlighted');
    highlighted = null;
    trigger.removeAttribute('aria-activedescendant');
  }

  function setHighlight(m) {
    if (!m) return;
    var prev = listbox.querySelector('[data-highlighted="true"]');
    if (prev) prev.removeAttribute('data-highlighted');
    highlighted = m;
    var el = optionEl(m);
    el.setAttribute('data-highlighted', 'true');
    trigger.setAttribute('aria-activedescendant', el.id);
    el.scrollIntoView({ block: 'nearest' });
  }

  /* Flip above the trigger when there is more room on top. */
  function place() {
    var rect = trigger.getBoundingClientRect();
    var below = window.innerHeight - rect.bottom - 12;
    var above = rect.top - 12;
    var space = below;
    if (below < 240 && above > below) {
      root.setAttribute('data-placement', 'top');
      space = above;
    } else {
      root.setAttribute('data-placement', 'bottom');
    }
    listbox.style.maxHeight = Math.max(180, Math.min(340, space)) + 'px';
  }

  function openListbox() {
    place();
    isOpen = true;
    root.setAttribute('data-state', 'open');
    trigger.setAttribute('aria-expanded', 'true');
    var start = selected && !selected.note ? selected : enabled()[0];
    setHighlight(start);
  }

  function closeListbox() {
    isOpen = false;
    root.setAttribute('data-state', 'closed');
    trigger.setAttribute('aria-expanded', 'false');
    clearHighlight();
  }

  function choose(m) {
    if (!m || m.note) return;
    selected = m;
    renderSelection();
    if (isOpen) closeListbox();
  }

  function move(dir) {
    var list = enabled();
    if (!list.length) return;
    var i = highlighted && !highlighted.note ? list.indexOf(highlighted) : -1;
    if (i === -1 && dir < 0) i = 0;
    i = (i + dir + list.length) % list.length;
    setHighlight(list[i]);
  }

  function typeahead(char) {
    buffer += char.toLowerCase();
    if (bufferTimer) clearTimeout(bufferTimer);
    bufferTimer = setTimeout(function () {
      buffer = '';
    }, 500);
    var list = enabled();
    var start = highlighted && !highlighted.note ? list.indexOf(highlighted) : -1;
    for (var k = 1; k <= list.length; k++) {
      var cand = list[(start + k) % list.length];
      if (cand.name.toLowerCase().indexOf(buffer) === 0) {
        if (isOpen) setHighlight(cand);
        else choose(cand);
        return;
      }
    }
  }

  trigger.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowDown' || k === 'ArrowUp') {
      e.preventDefault();
      var dir = k === 'ArrowDown' ? 1 : -1;
      if (e.altKey) {
        if (!isOpen) openListbox();
        return;
      }
      if (isOpen) move(dir);
      else openListbox();
    } else if (k === 'Home' || k === 'End') {
      e.preventDefault();
      var list = enabled();
      if (!list.length) return;
      if (!isOpen) openListbox();
      setHighlight(k === 'Home' ? list[0] : list[list.length - 1]);
    } else if (k === 'Enter') {
      e.preventDefault();
      if (isOpen) choose(highlighted);
      else openListbox();
    } else if (k === ' ') {
      e.preventDefault();
      if (!isOpen) openListbox();
    } else if (k === 'Escape') {
      if (isOpen) {
        e.preventDefault();
        closeListbox();
      }
    } else if (k === 'Tab') {
      if (isOpen) closeListbox();
    } else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      typeahead(k);
    }
  });

  trigger.addEventListener('click', function () {
    trigger.focus({ preventScroll: true });
    if (isOpen) closeListbox();
    else openListbox();
  });

  /* Focus stays on the trigger; clicks in the popup must not steal it. */
  listbox.addEventListener('pointerdown', function (e) {
    e.preventDefault();
  });

  listbox.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('.option') : null;
    if (!el) return;
    choose(byId(el.getAttribute('data-id')));
  });

  document.addEventListener('pointerdown', function (e) {
    if (isOpen && !root.contains(e.target)) closeListbox();
  });

  document.addEventListener('focusin', function (e) {
    if (isOpen && !root.contains(e.target)) closeListbox();
  });

  window.addEventListener('resize', function () {
    if (isOpen) closeListbox();
  });

  window.addEventListener('scroll', function () {
    if (isOpen) closeListbox();
  });

  renderSelection();
})();
</script>
</body>
</html>
